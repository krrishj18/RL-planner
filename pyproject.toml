[project]
name = "rlplanner"
version = "0.1.0"
description = "RL planner/allocator PoC for multi-robot casualty search on procedurally generated 2.5D disaster scenes, with a simulated RayFronts semantic mapper."
authors = [{ name = "krrishj18", email = "krrishj@andrew.cmu.edu" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "numba>=0.61",
    "matplotlib>=3.9",
    "imageio>=2.35",
    "imageio-ffmpeg>=0.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "torch>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.6", "hypothesis>=6.100"]
embed = [
    "open-clip-torch>=3.3.0",
    "torchvision>=0.26",
    "transformers>=4.44",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
