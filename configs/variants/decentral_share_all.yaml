# 2. decentral_share_all — per-robot beliefs, share everything within range,
# link range drawn per episode from 100 / 200 / 400 / inf m.
notes: "per-robot maps, full gossip payload, randomised range"
comms:
  mode: range
  randomize_range: true
  range_choices: [100.0, 200.0, 400.0, .inf]
  relay_hops: 0
  spawn_exchange: true
  share:
    rays: all
    ray_cap: 64
    coverage: true
    coverage_cell_m: 8.0
    segments: true
    segment_cap: 32
    visited: true
    features: false
tokens:
  local_size: 64
  robot_bev_size: 32
train:
  use-local: true
  use-bev: true
  use-robot-bev: true
  peers: true
  # decentralised execution: no same-decision claim mask. A peer's intent reaches this
  # robot only through gossip, one decision later (CONTRACTS.md 6).
  sequential_decode: false
