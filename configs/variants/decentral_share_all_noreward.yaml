# 6. decentral_share_all_noreward — variant 2 with the redundancy and revisit terms off,
# so the reward is casualties + time exactly as before.
notes: "share everything; no redundancy / revisit terms"
comms:
  mode: range
  randomize_range: true
  range_choices: [100.0, 200.0, 400.0, .inf]
  share:
    rays: all
    ray_cap: 64
    coverage: true
    coverage_cell_m: 8.0
    segments: true
    segment_cap: 32
    visited: true
    features: false
reward:
  redundancy_cost: 0.0
  revisit_cost: 0.0
tokens:
  local_size: 64
  robot_bev_size: 32
train:
  use-local: true
  use-bev: true
  use-robot-bev: true
  peers: true
  # decentralised execution: no same-decision claim mask. A peer's intent reaches this
  # robot only through gossip, one decision later (CONTRACTS.md 6).
  sequential_decode: false
